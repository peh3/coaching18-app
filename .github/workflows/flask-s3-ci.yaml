name: CI - Flask S3 Service
run-name: "CI - Flask S3 Service by @${{ github.actor }}"

on:
  pull_request:
    branches: [main]
    paths:
      - 'flask-s3-service/**'
      - '.github/workflows/ci-flask-s3.yaml'
  workflow_dispatch:    

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Getting initiator name
        run: echo "Workflow initiated by ${{ github.actor }} from branch ${{ github.ref_name }}"
  
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Validate Syntax
        run: |
          pip install --no-cache-dir -r flask-s3-service/requirements.txt
          python -m py_compile flask-s3-service/app.py

  snyk-code-and-sca:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r flask-s3-service/requirements.txt

      - name: Snyk Open Source Test (SCA)
        run: snyk test --file=flask-s3-service/requirements.txt --severity-threshold=high

      - name: Snyk Code Test (SAST)
        run: snyk code test flask-s3-service/ --severity-threshold=high

  docker-build-test:
    needs: snyk-code-and-sca
    #needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Test building the container locally in CI (no push)
      - name: Build Docker Image
        run: |
          docker build \
            --tag flask-s3-test:${{ github.sha }} \
            flask-s3-service/

      - name: Setup Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # Scan the newly built local image and Dockerfile for vulnerabilities
      - name: Snyk Container Scan
        run: |
          snyk container test flask-s3-test:${{ github.sha }} \
            --file=flask-s3-service/Dockerfile \
            --severity-threshold=high