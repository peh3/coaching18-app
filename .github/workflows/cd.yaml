name: App Multi-Env Deploy (Manual)

run-name: "Deploy [${{ inputs.environment }}] by @${{ github.actor }}"

on:
  workflow_dispatch:
    # inputs:
    #   environment:
    #     description: 'Target deployment environment'
    #     required: true
    #     default: 'dev'
    #     type: choice
    #     options:
    #       - dev
    #       - uat
    #       - prod

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  # ==========================================================
  # 1. Build and Push Container Image to ECR
  # ==========================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # environment: ${{ github.event.inputs.environment }}

    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}
      image_tag: ${{ steps.set-tag.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Short Git SHA
        id: set-tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Debug Environment Variables
        run: |
          echo "ECR Registry: ${{ steps.login-ecr.outputs.registry }}"
          echo "ECR Repository Var: '${{ vars.ECR_REPOSITORY }}'"
          echo "Target Image Tag: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"

        # echo "Selected Environment: ${{ inputs.environment }}"

      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
      
      - name: Export Image URI
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ==========================================================
  # 2. Deploy to the Selected ECS Environment
  # ==========================================================
  deploy:
    name: Deploy to ECS (${{ inputs.environment }})
    needs: build-and-push
    runs-on: ubuntu-latest

    # Injects the environment-specific variables (ECS_CLUSTER, ECS_SERVICE, etc.)
    environment: ${{ inputs.environment }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Download & Sanitize Existing Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.TASK_DEF }} \
            --query taskDefinition \
            | jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .containerDefinitions[].restartPolicy,
                .containerDefinitions[].versionConsistency
              )' > task-definition.json

      - name: Render Updated Task Definition with New Image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy Task Definition to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: false